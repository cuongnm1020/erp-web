# Deploy apps/web qua GHCR + SSH. Stack compose + script deploy-web.sh do repo api chép lên /opt/erp
# (deploy api TRƯỚC lần đầu). Xem apps/api deploy/PRODUCTION.md §12 + deploy/README.md.
#
# push main    → production: build inline NEXT_PUBLIC_API_URL,         tag sha-xxxxxxx + main
# push develop → staging:    build inline NEXT_PUBLIC_API_URL_STAGING, tag stg-sha-xxxxxxx + develop
#                Chỉ chạy khi repo variable STAGING_DEPLOY = on.
# NEXT_PUBLIC_API_URL bị inline lúc build → image staging và production KHÁC nhau, tag phải khác nhau.
# workflow_dispatch trên main/develop → như trên, hoặc chỉ deploy lại một tag có sẵn (rollback).
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy lại tag có sẵn (vd sha-1a2b3c4). Bỏ trống = build từ ref hiện tại.'
        required: false
        default: ''

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Typecheck + lint + test
    if: ${{ github.event.inputs.tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    name: Build & push image
    if: ${{ github.event.inputs.tag == '' && (github.ref_name == 'main' || vars.STAGING_DEPLOY == 'on') }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      API_URL_VAR: ${{ github.ref_name == 'main' && 'NEXT_PUBLIC_API_URL' || 'NEXT_PUBLIC_API_URL_STAGING' }}
      TAG_PREFIX: ${{ github.ref_name == 'main' && 'sha' || 'stg-sha' }}
    steps:
      - uses: actions/checkout@v4
      # Không dùng `a && b || c` cho giá trị: biến production trống sẽ rơi sang URL staging.
      - name: Require ${{ env.API_URL_VAR }} (repo variable)
        id: url
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then v='${{ vars.NEXT_PUBLIC_API_URL }}'; else v='${{ vars.NEXT_PUBLIC_API_URL_STAGING }}'; fi
          test -n "$v" || { echo "Thiếu repository variable $API_URL_VAR (vd https://api.erp.example.com)" >&2; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - id: meta
        run: |
          echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.url.outputs.value }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to server
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.tag != '') && (github.ref_name == 'main' || (github.ref_name == 'develop' && vars.STAGING_DEPLOY == 'on')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Secret DEPLOY_* đặt ở từng Environment (production / staging), KHÔNG ở mức repo.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || needs.build.outputs.tag }}
    steps:
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host erp
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF
      - name: Deploy ${{ env.TAG }}
        run: |
          ssh erp "test -x /opt/erp/bin/deploy-web.sh || { echo 'Chưa có /opt/erp/bin/deploy-web.sh — deploy repo api trước' >&2; exit 1; }"
          ssh erp "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && /opt/erp/bin/deploy-web.sh '${{ env.TAG }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
